<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halaman Tidak Ditemukan — EduVerse</title>
  <meta name="description" content="Halaman EduVerse yang kamu cari tidak ditemukan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="flex min-h-screen flex-col bg-[#f5f5f5] font-sans text-gray-900 antialiased">
  <header class="border-b border-gray-100 bg-white">
    <nav class="mx-auto flex w-full max-w-[1280px] items-center px-4 py-4 sm:px-8" aria-label="Navigasi utama">
      <a href="../index.html" class="flex items-center" aria-label="EduVerse — kembali ke beranda">
        <img src="../img/logo-eduverse.png" alt="EduVerse" class="h-9 w-auto" />
      </a>
    </nav>
  </header>

  <main id="main-content" class="flex flex-1 items-center justify-center px-4 py-16 sm:px-8">
    <section class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-sm sm:p-12"
      aria-labelledby="not-found-heading">
      <p class="text-6xl font-bold text-primary" aria-hidden="true">404</p>
      <h1 id="not-found-heading" class="mt-4 text-2xl font-bold text-gray-900">Halaman Tidak Ditemukan</h1>
      <p class="mt-3 text-sm leading-relaxed text-gray-600">
        <span id="resource-label">Konten</span> yang kamu cari tidak tersedia atau tautannya sudah tidak valid.
      </p>
      <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
        <a href="../index.html"
          class="rounded-lg bg-primary px-6 py-3 text-sm font-bold text-[#251a00] transition hover:bg-primary-hover">Kembali
          ke Beranda</a>
        <a href="courses.html"
          class="rounded-lg border border-navy px-6 py-3 text-sm font-bold text-navy transition hover:bg-gray-50">Lihat
          Kelas</a>
      </div>
    </section>
  </main>

  <script>
    const labels = {
      course: 'Kelas',
      bootcamp: 'Bootcamp',
      payment: 'Pesanan',
    };
    const resource = new URLSearchParams(window.location.search).get('resource');
    document.getElementById('resource-label').textContent = labels[resource] || 'Konten';
  </script>
</body>

</html>
